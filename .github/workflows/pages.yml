name: Deploy Pages (main + dev preview)

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble site (main at / , dev at /dev/)
        run: |
          mkdir -p _site
          git archive origin/main | tar -x -C _site
          mkdir -p _site/dev
          git archive origin/dev | tar -x -C _site/dev
          # avoid nested .git if any
          rm -rf _site/.git _site/dev/.git || true
          # rewrite relative base for /dev/ if needed — app uses relative paths, OK under /dev/
          printf '%s\n' 'User-agent: *' 'Allow: /' > _site/robots.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
